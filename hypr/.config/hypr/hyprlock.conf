# hyprlock configuration
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(8, 17, 31, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(237, 246, 255, 1.0)
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(155, 174, 196, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

# Battery (portátil) - esquina inferior derecha
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%"
    color = rgba(136, 192, 208, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# Input field
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(125, 211, 252, 0.55)
    inner_color = rgba(22, 34, 56, 0.88)
    font_color = rgba(237, 246, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##9baec4">Contraseña...</span>
    hide_input = false
    rounding = 14
    check_color = rgba(125, 211, 252, 1.0)
    fail_color = rgba(255, 107, 122, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -130
    halign = center
    valign = center
}
